<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heroikzre — Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header>
    <nav>
      <a class="logo" href="index.html">HERO<span>IKZRE</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="pajangan.html">Projects</a></li>
        <li><a href="kontak.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section">
      <h1 class="section-title" style="text-align:left;">Game</h1>
      <p class="page-sub" style="text-align:left;margin-bottom:1.5rem;">Kumpulan game HTML buatan sendiri — langsung main di browser.</p>

      <div class="cards">
        <div class="card" style="padding:0;overflow:hidden;">
          <img src="gambar/kapalbom.png" alt="Kapal Bom" style="width:100%;display:block;">
          <div style="padding:1rem 1.5rem 1.5rem;">
            <h3>Kapal Bom</h3>
            <p>Action · 2023</p>
            <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
              <a class="btn btn-primary" href="game/kapalbom.html">Main</a>
              <button class="btn btn-light-ghost" onclick="openPreview('Kapal Bom','gambar/kapalbom.png')">Preview</button>
            </div>
          </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
          <img src="gambar/mathfast.png" alt="Math Fast" style="width:100%;display:block;">
          <div style="padding:1rem 1.5rem 1.5rem;">
            <h3>Math Fast</h3>
            <p>Kecerdasan · 2025</p>
            <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
              <a class="btn btn-primary" href="game/mathfast.html">Main</a>
              <button class="btn btn-light-ghost" onclick="openPreview('Math Fast','gambar/mathfast.png')">Preview</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" onclick="closePreview()">&times;</span>
      <h2 id="previewTitle" style="font-family:'Space Grotesk',sans-serif;"></h2>
      <img id="previewImage" style="width:100%;border-radius:10px;margin-top:10px;">
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Heroikzre</p>
  </footer>

  <style>
    .modal { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 20px; z-index: 2000; }
    .modal-content { background: #fff; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; }
    .close { float: right; cursor: pointer; font-size: 24px; color: var(--text-soft); }
  </style>

  <script>
    function openPreview(title, img){
      document.getElementById("previewTitle").innerText = title;
      document.getElementById("previewImage").src = img;
      document.getElementById("previewModal").style.display = "flex";
    }
    function closePreview(){
      document.getElementById("previewModal").style.display = "none";
    }
    document.getElementById("previewModal").addEventListener("click", function(e){
      if(e.target === this) closePreview();
    });
  </script>

<script src="site.js"></script>
</body>
</html>
